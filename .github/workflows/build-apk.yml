name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Generate RouterMate home-screen icon
        run: |
          python -m pip install --user pillow cairosvg
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import cairosvg
          from PIL import Image

          svg = Path("app/src/main/assets/img/routermate-lockup.svg").read_bytes()
          rendered = Image.open(BytesIO(cairosvg.svg2png(bytestring=svg, output_width=900, output_height=650))).convert("RGBA")

          # Legacy launcher icon: full RouterMate mark and wordmark on pure white.
          legacy = Image.new("RGBA", (192, 192), (255, 255, 255, 255))
          artwork = rendered.copy()
          artwork.thumbnail((178, 178), Image.Resampling.LANCZOS)
          legacy.alpha_composite(artwork, ((192-artwork.width)//2, (192-artwork.height)//2))
          Path("app/src/main/res/mipmap-xxhdpi").mkdir(parents=True, exist_ok=True)
          legacy.convert("RGB").save("app/src/main/res/mipmap-xxhdpi/ic_launcher.png", optimize=True)

          # Adaptive-icon foreground: keep all artwork within Android's central safe area.
          foreground = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          artwork = rendered.copy()
          artwork.thumbnail((330, 330), Image.Resampling.LANCZOS)
          foreground.alpha_composite(artwork, ((512-artwork.width)//2, (512-artwork.height)//2))
          Path("app/src/main/res/drawable-nodpi").mkdir(parents=True, exist_ok=True)
          foreground.save("app/src/main/res/drawable-nodpi/ic_launcher_fg.png", optimize=True)
          PY
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources><color name="ic_bg">#FFFFFF</color></resources>' > app/src/main/res/values/colors.xml
      - run: node tests/test-client.js
      - run: node tests/test-ai.js
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Prepare fixed signing key
        env: { KEYSTORE_B64: '${{ secrets.KEYSTORE_B64 }}' }
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/routermate.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/routermate.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_B64 secret missing: building with a temporary debug key (updates will not install over older builds)"
          fi
      - run: gradle --no-daemon assembleDebug
        env: { KEYSTORE_PASSWORD: '${{ secrets.KEYSTORE_PASSWORD }}', KEY_ALIAS: '${{ secrets.KEY_ALIAS }}' }
      - uses: actions/upload-artifact@v4
        with:
          name: RouterMate-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RouterMate.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest RouterMate.apk --title "RouterMate (latest)" --notes "Download RouterMate.apk on your Android phone and install it."
