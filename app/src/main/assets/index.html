<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RouterMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Sora:wght@600;700&display=swap">
<style>
/* Layout: sign-in card, then left rail on laptop and bottom tab bar on phone. Colors and fonts are tokens, so the whole look changes from this block. */
:root {
  --bg: #f2f5f6; --surface: #ffffff; --surface-2: #e8eef0; --line: #d3dde0;
  --glow1: #d3eef1; --glow2: #e6e3f8; --glow3: #fbeede;
  --fg: #11262b; --muted: #5a7078; --accent: #0b7a86; --accent-ink: #ffffff; --accent-soft: #d6eef0;
  --good: #1b8a4b; --good-soft: #d9f1e3; --warn: #a86a00; --warn-soft: #fbecc9; --bad: #c0352b; --bad-soft: #f9dcd9;
  --font-display: "Sora", "Noto Sans Bengali", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Noto Sans Bengali", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", "Noto Sans Bengali", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --glow1: #123a41; --glow2: #1d2347; --glow3: #2b2418;
    --bg: #0c1a1e; --surface: #132a30; --surface-2: #1b363d; --line: #27444c; --fg: #e4f0f2; --muted: #8fabb2;
    --accent: #3cc3d1; --accent-ink: #052a30; --accent-soft: #14424a; --good: #52d08a; --good-soft: #14392a;
    --warn: #f0b650; --warn-soft: #3f2f10; --bad: #ff8a80; --bad-soft: #4a1f1c; color-scheme: dark;
  }
}
* { box-sizing: border-box; touch-action: manipulation; }
input, select { font-size: 16px; }
body { overscroll-behavior-y: contain; }
.ptr { position: fixed; top: 0; left: 50%; transform: translate(-50%, -60px); z-index: 50; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.12); pointer-events: none; transition: transform .15s; }
.ptr.show { transition: none; }
body { margin: 0; background: radial-gradient(900px 520px at 0% -8%, var(--glow1), transparent 62%), radial-gradient(780px 480px at 100% 4%, var(--glow2), transparent 60%), radial-gradient(900px 520px at 50% 108%, var(--glow3), transparent 60%), var(--bg); background-attachment: fixed; color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; padding: 16px 16px 88px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.app { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; }
.rail { position: sticky; top: 16px; align-self: start; display: flex; flex-direction: column; gap: 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.brand svg { width: 28px; height: 28px; color: var(--accent); flex: none; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 500; }
.nav a svg { width: 20px; height: 20px; flex: none; }
.nav a:hover { background: var(--surface-2); color: var(--fg); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-size: 24px; line-height: 1.3; margin: 0; }
.sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500; min-height: 40px; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.danger:hover { background: var(--bad-soft); }
.btn.sm { min-height: 34px; padding: 5px 12px; font-size: 14px; }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 14px; font-size: 13px; }
.notice.err { background: var(--bad-soft); color: var(--bad); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-size: 15px; margin: 0 0 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
:root[lang="bn"] .tile .k { letter-spacing: 0; text-transform: none; font-size: 13px; }
.isp-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.isp-b { display: flex; align-items: center; justify-content: center; aspect-ratio: 1; min-height: 64px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--fg); padding: 6px; cursor: pointer; }
.isp-b:active { background: var(--accent-soft); }
.isp-b img { width: 44px; height: 44px; border-radius: 10px; }
.isp-fb { font-size: 12px; text-align: center; line-height: 1.2; }
#nets, #wans, #wifi-body { display: flex; flex-direction: column; gap: 12px; }
.grp { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 6px 2px 8px; font-size: 16px; }
.grp small { color: var(--muted); font-size: 13px; font-weight: 400; }
.grp-box { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.net-head { display: flex; align-items: center; gap: 10px; font-size: 17px; }
.net-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); flex: none; }
.net.ok .net-dot { background: var(--good); } .net.bad .net-dot { background: var(--bad); } .net.bad { border-color: var(--bad); }
.net .hint { color: var(--muted); font-size: 14px; margin: 6px 0 10px; }
.pill.rt { background: var(--accent-soft); color: var(--fg); }
.rt-select { width: 100%; min-height: 44px; margin: 6px 0 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); padding: 0 10px; font: inherit; }
#rbar { margin-bottom: 12px; }
.rt-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.rt-row .grow { flex: 1; min-width: 160px; overflow-wrap: anywhere; }
.rt-row small { display: block; color: var(--muted); font-size: 12px; }
.rt-row .rt-state { display: inline-flex; margin-top: 6px; }
.rt-toggle { min-width: 104px; }
.rt-toggle[aria-pressed="true"] { border-color: rgba(46,229,157,.5); color: var(--good); }
.rt-toggle[aria-pressed="false"] { border-color: var(--line); color: var(--muted); }
.acl h2 { margin-bottom: 4px; }
.acl .hint { color: var(--muted); font-size: 14px; margin: 6px 0 12px; }
.acl-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-height: 48px; }
.acl-row input { width: 22px; height: 22px; flex: none; accent-color: var(--accent); }
.acl-row span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.acl-row small { display: block; color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.acl-actions { margin-top: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tile.tap { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.tile.tap:active { background: var(--accent-soft); }
.tile .v { font-family: var(--font-mono); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; margin-top: 4px; }
.tile .v small { font-size: 13px; color: var(--muted); margin-inline-start: 4px; }
.two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-inline-end: 6px; }
.top-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.top-list li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 14px; }
.top-list .bar { grid-column: 1 / -1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.top-list .bar span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: end; font-family: var(--font-mono); overflow-wrap: anywhere; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; min-height: 40px; }
.chips { display: flex; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.devices { display: flex; flex-direction: column; gap: 10px; }
.dev { display: grid; grid-template-columns: 44px minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.dev.blocked { opacity: .85; }
.dev .ico { width: 44px; height: 44px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.dev.blocked .ico { background: var(--bad-soft); color: var(--bad); }
.dev .ico svg { width: 24px; height: 24px; }
.dev .name { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dev .meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.dev .use { font-size: 13px; color: var(--muted); }
.dev .use b { color: var(--fg); font-family: var(--font-mono); font-weight: 500; }
.dev .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.dev .acts label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
select, input[type="text"], input[type="password"] { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; min-height: 34px; max-width: 100%; }
/* Password visibility toggle */
.password-wrap { position: relative; width: 100%; }
.password-wrap > input { width: 100%; padding-right: 48px !important; }
.password-visibility { position: absolute; top: 50%; right: 8px; transform: translateY(-50%); width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; padding: 0; }
.password-visibility:hover { background: var(--surface-2); color: var(--fg); }
.password-visibility svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; }
.field input { width: 100%; min-height: 42px; }
.act-list { list-style: none; margin: 0; padding: 0; }
.act-list li { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.act-list li:first-child { border-top: 0; }
.act-list time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-top: 2px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
.login { min-height: calc(100vh - 120px); display: grid; place-items: center; }
.login-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.login-card h1 { font-size: 20px; }
.login-card p { margin: 0; color: var(--muted); font-size: 14px; }
.login-err { color: var(--bad); font-size: 14px; min-height: 22px; }
.welcome-screen { min-height: calc(100vh - 32px); display: grid; place-items: center; padding: 20px; }
.welcome-card { width: 100%; max-width: 390px; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 34px 24px; text-align: center; background: rgba(10,28,64,.55); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 4px 28px rgba(0,40,140,.28); backdrop-filter: blur(8px); }
.welcome-card .lockup img { width: min(78vw, 290px); height: auto; }
.welcome-card p { margin: 0; color: var(--muted); font-size: 14px; }
.welcome-signup { width: 100%; max-width: 280px; min-height: 48px; font-weight: 700; font-size: 16px; }
.login-top { display: flex; justify-content: flex-end; max-width: 380px; margin: 0 auto; }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; }
  .rail .brand { display: none; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; flex-direction: row; background: var(--surface); border-top: 1px solid var(--line); z-index: 20; padding: 6px 8px; gap: 2px; }
  .nav a { flex: 1; flex-direction: column; gap: 2px; font-size: 12px; padding: 6px 4px; justify-content: center; text-align: center; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .dev { grid-template-columns: 44px minmax(0, 1fr); }
  .dev .use, .dev .acts { grid-column: 1 / -1; }
  .dev .acts { justify-content: flex-start; }
  h1 { font-size: 21px; }
}
/* RouterMate dark theme (overrides the tokens above) */
:root, :root:not([data-theme="light"]) {
  --bg: #050c1c; --surface: rgba(12,30,66,.72); --surface-2: rgba(30,64,130,.35); --line: rgba(56,120,230,.38);
  --glow1: #0a3a8a; --glow2: #0b2a6e; --glow3: #06183d;
  --fg: #eef4ff; --muted: #8fb0e8; --accent: #1e90ff; --accent-ink: #ffffff; --accent-soft: rgba(30,144,255,.18);
  --good: #2ee59d; --good-soft: rgba(46,229,157,.14); --warn: #f5b942; --warn-soft: rgba(245,185,66,.14); --bad: #ff5d73; --bad-soft: rgba(255,93,115,.14);
  color-scheme: dark;
}
body { background: radial-gradient(700px 420px at 0% -6%, rgba(20,110,255,.45), transparent 62%), radial-gradient(600px 400px at 100% 0%, rgba(30,70,200,.35), transparent 60%), radial-gradient(800px 500px at 50% 110%, rgba(10,60,160,.4), transparent 60%), var(--bg); background-attachment: fixed; }
.panel, .tile, .dev, .login-card { backdrop-filter: blur(6px); box-shadow: 0 0 0 1px rgba(30,144,255,.08) inset, 0 4px 24px rgba(0,40,140,.25); border-radius: 16px; }
.brand { gap: 10px; }
.brand img { width: 40px; height: 34px; object-fit: contain; }
.brand b { font-family: var(--font-display); font-size: 22px; color: #fff; display: block; line-height: 1.1; }
.brand b i { font-style: normal; color: #21a8ff; }
.brand small { display: block; font-size: 8.5px; letter-spacing: .26em; color: #c9dcff; margin-top: 3px; }
.btn { background: rgba(12,30,66,.6); border-radius: 12px; }
.btn:hover { background: rgba(30,64,130,.5); }
.btn.primary { background: linear-gradient(180deg, #2f9bff, #0b63e6); border-color: #3aa0ff; box-shadow: 0 0 18px rgba(30,144,255,.45); }
.chip { background: rgba(12,30,66,.6); }
.chip[aria-pressed="true"] { background: linear-gradient(180deg, #2f9bff, #0b63e6); border-color: #3aa0ff; box-shadow: 0 0 14px rgba(30,144,255,.4); }
select, input[type="text"], input[type="password"], .search { background: rgba(8,22,52,.8); color: var(--fg); border-radius: 12px; border-color: var(--line); }
.pill.good { border: 1px solid rgba(46,229,157,.35); box-shadow: 0 0 14px rgba(46,229,157,.2); }
h1 { font-size: 30px; }
.login { min-height: auto; padding-top: 4vh; }
.lockup { text-align: center; } .lockup img { width: min(78%, 300px); height: auto; }
.login-card { background: rgba(10,28,64,.55); }
.lh { text-align: center; } .lh h1 { font-size: 22px; } .lh p { margin-top: 4px; }
.secure { text-align: center; color: var(--muted); font-size: 12px; letter-spacing: .2em; margin-top: 14px; text-transform: uppercase; }
.login-router { display: block; width: min(86%, 340px); margin: 6px auto 0; pointer-events: none; }
.tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px; }
.tile .k { text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--fg); font-weight: 500; }
.tile .v { font-family: var(--font-display); font-size: 28px; line-height: 1.1; }
.ti { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.ti svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ti.c1 { background: rgba(30,144,255,.2); color: #46b4ff; box-shadow: 0 0 0 1px rgba(70,180,255,.5); }
.ti.c2 { background: rgba(255,93,115,.18); color: #ff6b81; box-shadow: 0 0 0 1px rgba(255,93,115,.5); }
.ti.c3 { background: rgba(120,80,255,.22); color: #a58cff; box-shadow: 0 0 0 1px rgba(150,120,255,.5); }
.hero { position: relative; overflow: hidden; display: grid; grid-template-columns: 38% 1fr; gap: 8px; align-items: center; min-height: 150px; background: linear-gradient(135deg, rgba(14,48,110,.85), rgba(8,24,60,.8)); }
.hero-img { width: 100%; height: auto; -webkit-mask-image: radial-gradient(ellipse at center, #000 55%, transparent 100%); mask-image: radial-gradient(ellipse at center, #000 55%, transparent 100%); }
.hero-t small { color: #7cc4ff; font-size: 13px; }
.hero .net-head b { font-size: 24px; font-family: var(--font-display); }
.hero .hint { font-size: 13px; margin: 4px 0; }
.net.ok .net-dot { background: var(--good); box-shadow: 0 0 10px var(--good); }
.rd { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid rgba(56,120,230,.22); }
.rd:first-of-type { border-top: 0; }
.rd-i { width: 42px; height: 42px; border-radius: 12px; background: rgba(30,144,255,.16); color: #46b4ff; display: grid; place-items: center; box-shadow: 0 0 0 1px rgba(70,180,255,.35); }
.rd-i svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.rd-n { flex: 1; min-width: 0; font-weight: 600; } .rd-n small { display: block; color: #6fb2ff; font-weight: 400; font-family: var(--font-mono); font-size: 12px; }
.rd-s { color: var(--good); font-size: 13px; }
.wtabs { flex-wrap: wrap; gap: 6px; } .wtabs .chip { padding: 5px 11px; font-size: 13px; }
#view-wifi[data-tab="net"] .wb-guest, #view-wifi[data-tab="net"] .wb-acl,
#view-wifi[data-tab="guest"] .wb-net, #view-wifi[data-tab="guest"] .wb-acl,
#view-wifi[data-tab="acl"] .wb-net, #view-wifi[data-tab="acl"] .wb-guest { display: none !important; }
.act-list li { grid-template-columns: 56px 1fr; }
.ev::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-inline-end: 9px; background: #2f9bff; box-shadow: 0 0 8px currentColor; }
.ev-e_in::before { background: var(--good); } .ev-e_out::before, .ev-e_block::before { background: var(--bad); } .ev-e_limit::before { background: var(--warn); }
.about { display: flex; align-items: center; gap: 12px; } .about img { width: 40px; height: 34px; object-fit: contain; } .about small { display: block; color: var(--muted); }
.isp-btns { gap: 8px; } .isp-b { min-width: 0; min-height: 0; aspect-ratio: auto; height: 64px; }
.main { gap: 12px; }

/* RouterMate visual refresh — preserve existing DOM, IDs and router logic. */
:root {
  --bg:#07111f; --surface:#0d1b2c; --surface-2:#12253a; --line:rgba(103,178,218,.19);
  --glow1:rgba(0,196,255,.14); --glow2:rgba(57,92,255,.13); --glow3:rgba(0,235,200,.08);
  --fg:#eaf6ff; --muted:#91a9bd; --accent:#27c7f5; --accent-ink:#031421; --accent-soft:rgba(39,199,245,.13);
  --good:#35dfa5; --good-soft:rgba(53,223,165,.13); --warn:#ffc66d; --warn-soft:rgba(255,198,109,.13);
  --bad:#ff7185; --bad-soft:rgba(255,113,133,.13);
  --font-display:"Sora","Noto Sans Bengali","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Noto Sans Bengali","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { color-scheme:dark; }
}
html { min-height:100%; background:var(--bg); }
body {
  min-height:100vh; padding:22px 22px 100px; color:var(--fg);
  background:
    radial-gradient(900px 520px at 0% -10%,rgba(0,190,255,.16),transparent 62%),
    radial-gradient(760px 480px at 100% 0%,rgba(69,89,255,.15),transparent 60%),
    radial-gradient(900px 560px at 50% 110%,rgba(0,210,180,.08),transparent 62%), var(--bg);
  background-attachment:fixed; font-size:15px; line-height:1.55;
}
button,input,select { font:inherit; }
.app { max-width:1320px; grid-template-columns:238px minmax(0,1fr); gap:28px; }
.rail { top:20px; padding:18px 14px; border:1px solid var(--line); border-radius:22px; background:rgba(8,22,38,.82); box-shadow:0 18px 50px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.035); backdrop-filter:blur(18px); }
.brand { gap:12px; padding:4px 7px 18px; border-bottom:1px solid var(--line); font-size:19px; }
.brand img { width:42px; height:42px; object-fit:contain; filter:drop-shadow(0 0 12px rgba(39,199,245,.3)); }
.brand b { color:#f2fbff; letter-spacing:-.04em; }
.brand i { color:var(--accent); font-style:normal; }
.brand small { display:block; color:var(--muted); font:600 9px var(--font-body); letter-spacing:.14em; margin-top:2px; }
.nav { gap:7px; padding-top:7px; }
.nav a { min-height:48px; padding:11px 13px; border:1px solid transparent; border-radius:13px; color:#9db5c9; font-size:14px; transition:background .18s,border-color .18s,color .18s,transform .18s; }
.nav a svg { width:19px; height:19px; }
.nav a:hover { color:#eaf8ff; background:rgba(39,199,245,.07); transform:translateX(2px); }
.nav a[aria-current="page"] { color:#68e3ff; background:linear-gradient(100deg,rgba(39,199,245,.18),rgba(39,199,245,.045)); border-color:rgba(39,199,245,.27); box-shadow:inset 3px 0 #27c7f5,0 0 22px rgba(39,199,245,.08); }
.main { gap:18px; }
.top { min-height:74px; padding:3px 2px 14px; border-bottom:1px solid var(--line); }
h1 { color:#f2f9ff; font-size:clamp(23px,3vw,30px); letter-spacing:-.045em; }
.sub { color:var(--muted); font-size:12px; }
.top-actions { gap:9px; }
.panel,.tile,.dev,.netcard,.hcard {
  color:var(--fg); background:linear-gradient(145deg,rgba(16,37,59,.96),rgba(10,25,42,.96));
  border:1px solid var(--line); border-radius:18px; box-shadow:0 12px 34px rgba(0,0,0,.16),inset 0 1px rgba(255,255,255,.035);
}
.panel { padding:19px; }
.panel h2 { color:#eaf7ff; font-size:16px; letter-spacing:-.02em; margin-bottom:14px; }
.hint,.sub,.tile .k,.dev .use,.dev .meta { color:var(--muted); }
.notice { border:1px solid rgba(255,198,109,.22); border-radius:13px; background:var(--warn-soft); color:#ffd58f; }
.notice.err { border-color:rgba(255,113,133,.25); background:var(--bad-soft); color:#ff9aa9; }
.pill { border:1px solid transparent; padding:4px 10px; font-size:11px; letter-spacing:.01em; }
.pill.good { background:var(--good-soft); color:#65edbd; border-color:rgba(53,223,165,.2); }
.pill.bad { background:var(--bad-soft); color:#ff91a1; border-color:rgba(255,113,133,.2); }
.pill.warn { background:var(--warn-soft); color:#ffd58f; border-color:rgba(255,198,109,.2); }
.btn { min-height:42px; padding:9px 15px; border-radius:12px; border-color:rgba(112,175,211,.23); background:rgba(17,39,61,.9); color:#d9efff; transition:transform .16s,background .16s,border-color .16s,box-shadow .16s; }
.btn:hover { background:rgba(28,60,87,.96); border-color:rgba(39,199,245,.4); box-shadow:0 0 18px rgba(39,199,245,.08); }
.btn:active { transform:scale(.98); }
.btn.primary { color:#031421; border-color:#27c7f5; background:linear-gradient(115deg,#32d5f5,#3c9dff); box-shadow:0 7px 22px rgba(39,180,245,.2); font-weight:700; }
.btn.primary:hover { background:linear-gradient(115deg,#65e7ff,#65b4ff); box-shadow:0 8px 25px rgba(39,180,245,.28); }
.btn.danger { color:#ff9aa9; border-color:rgba(255,113,133,.3); background:rgba(255,113,133,.06); }
.btn.danger:hover { background:var(--bad-soft); }

:root[data-theme="dark"] {
  color-scheme:dark;
  --bg:#071321; --surface:#102238; --surface-2:#172e46; --line:rgba(123,177,211,.2);
  --glow1:rgba(0,196,255,.15); --glow2:rgba(67,93,235,.15); --glow3:rgba(0,210,180,.08);
  --fg:#eaf6ff; --muted:#94aec2; --accent:#45c7e8; --accent-ink:#041723; --accent-soft:rgba(69,199,232,.14);
  --good:#43dba3; --good-soft:rgba(67,219,163,.13); --warn:#ffc66d; --warn-soft:rgba(255,198,109,.13); --bad:#ff8194; --bad-soft:rgba(255,129,148,.13);
}
:root[data-theme="dark"] body { background:radial-gradient(700px 420px at 0% -6%,rgba(20,130,180,.25),transparent 62%),radial-gradient(600px 400px at 100% 0%,rgba(49,67,180,.22),transparent 60%),linear-gradient(160deg,#071321,#0a1b2d 55%,#071321) !important; }

:root[data-theme="dark"] .tile .v,:root[data-theme="dark"] .dev .name,:root[data-theme="dark"] .kv dd { color:#f1f9ff !important; }
:root[data-theme="dark"] .tile .ti,:root[data-theme="dark"] .dev .ico,:root[data-theme="dark"] .rd-i { color:#61ddff !important; background:rgba(39,199,245,.12) !important; }
:root[data-theme="dark"] .btn { color:#d9efff !important; background:rgba(17,39,61,.9) !important; border-color:rgba(112,175,211,.23) !important; }
:root[data-theme="dark"] .btn:hover { background:rgba(28,60,87,.96) !important; }
:root[data-theme="dark"] .btn.primary { color:#031421 !important; background:linear-gradient(115deg,#32d5f5,#3c9dff) !important; border-color:#27c7f5 !important; }
:root[data-theme="dark"] .chip { color:#a9c1d4 !important; background:rgba(11,28,46,.92) !important; border-color:rgba(112,175,211,.2) !important; }

:root[data-theme="dark"] input[type="text"],:root[data-theme="dark"] input[type="password"],:root[data-theme="dark"] input[type="tel"],:root[data-theme="dark"] input[type="url"],:root[data-theme="dark"] input[type="number"],:root[data-theme="dark"] select,:root[data-theme="dark"] .search,:root[data-theme="dark"] .rt-select { color:#eaf6ff !important; background:#081727 !important; border-color:rgba(112,175,211,.24) !important; }
:root[data-theme="dark"] .field label,:root[data-theme="dark"] .kv dt { color:#a9c1d4 !important; }
:root[data-theme="dark"] .net.hero { background:radial-gradient(420px 200px at 100% 0%,rgba(39,199,245,.17),transparent 68%),linear-gradient(120deg,#102c45,#0b1b2d 72%) !important; }
:root[data-theme="dark"] .net .net-head { color:#effaff !important; }
:root[data-theme="dark"] #chat-log { background:rgba(4,16,29,.65) !important; }
:root[data-theme="dark"] .msg.ai { color:#eaf6ff !important; background:rgba(25,53,77,.88) !important; border-color:rgba(103,178,218,.2) !important; }
:root[data-theme="dark"] .bio-card { color:#eaf6ff !important; background:linear-gradient(145deg,#102c46,#0b1b2e) !important; }
:root[data-theme="dark"] .bio-card h2 { color:#eafaff !important; }
:root[data-theme="dark"] #ni-btn,:root[data-theme="dark"] .help-fab { color:#bdefff !important; background:rgba(8,25,42,.94) !important; border-color:rgba(39,199,245,.32) !important; }
:root[data-theme="dark"] .welcome-card { color:#eaf6ff !important; background:rgba(10,28,64,.88) !important; border-color:var(--line) !important; }
:root[data-theme="dark"] .welcome-card p { color:var(--muted) !important; }
:root[data-theme="dark"] .secure { color:#80a6bd !important; }
:root[data-theme="dark"] .hcard { background:rgba(8,24,40,.98) !important; }
:root[data-theme="dark"] .toast { background:#102b42 !important; color:#eaf8ff !important; }
@media (max-width:760px) {
  :root[data-theme="dark"] .nav { background:rgba(7,20,34,.97) !important; border-color:rgba(116,193,225,.25) !important; }
  :root:not([data-theme="dark"]) .nav { background:rgba(255,255,255,.96) !important; border:1px solid #dce7f0 !important; box-shadow:0 10px 28px rgba(31,67,99,.14) !important; }
}

/* RouterMate logo + separated welcome/auth stages */
.rm-lockup{display:flex;align-items:center;justify-content:center;gap:12px;min-height:58px}
.rm-mark{width:54px;height:54px;flex:none;filter:drop-shadow(0 5px 12px rgba(27,135,210,.18))}
.rm-word{font-family:var(--font-display);font-size:clamp(27px,6vw,36px);font-weight:700;letter-spacing:-1.5px;color:var(--fg);line-height:1}
.rm-word span{color:var(--accent)}
.welcome-card .rm-lockup{margin-bottom:2px}
.login-card .rm-lockup{justify-content:flex-start;margin-bottom:4px}
#login[hidden],#setup[hidden],#welcome[hidden],#app[hidden]{display:none!important}
#login:not([hidden]),#setup:not([hidden]),#welcome:not([hidden]){display:block;min-height:calc(100vh - 32px)}
#login:not([hidden]) .login,#setup:not([hidden]) .login{min-height:calc(100vh - 90px);display:grid;place-items:center;padding:24px 0}

.login-router-art{display:flex;justify-content:center;margin:8px auto 0;opacity:.9}.login-router-art svg{height:auto;max-height:120px}

      }, function () { return shown + " error"; });
    })).then(function (lines) {
      return fpScripts(base, luciHtml).then(function (js) { return lines.join("\n") + (js ? "\n" + js.slice(0, 6000) : ""); });
    }, function () { return ""; });
  }
  $("#rep-btn").addEventListener("click", function () { try { Native.copyText(lastReport); this.textContent = t("rep_done"); } catch (e) {} });
  $("#setup-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var err = $("#setup-err"), rname = "Router 1", url = $("#s-url").value.trim().replace(/\/+$/, ""), rpw = $("#s-rpw").value, a1 = $("#s-apw").value, a2 = $("#s-apw2").value;
    err.textContent = "";
    if (!/^https?:\/\//i.test(url)) url = "http://" + url;
    if (a1.length < 6) { err.textContent = t("s_short"); return; }
    if (a1 !== a2) { err.textContent = t("s_match"); return; }
    $("#setup-btn").disabled = true; err.textContent = t("s_checking");
    var rtype = "", rep = $("#rep-btn"); rep.hidden = true;
    resolveType(url, rpw, $("#s-type").value).then(function (r) {
      rtype = r.type; lastReport = makeReport(url, r, "");
      if (!rtype) {
        var msg = r.notes && r.notes.some(function (n) { return /rejected/.test(n); }) ? t("s_rbad") : t("s_unk");
        return fingerprint(hostOf(url)).then(function (fp) { lastReport = makeReport(url, r, "", fp); rep.hidden = false; rep.textContent = t("rep_copy"); throw new Error(msg); });
      }
      return new RouterClient({ url: url, password: rpw, native: nativeApi, type: rtype }).login();
    }).then(function (ok) {
      if (!ok) throw new Error(t("s_rbad"));
      var salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem("wifi-cfg", JSON.stringify({ routers: [{ id: "r1", name: rname, url: url, rpw: rpw, type: rtype }], salt: salt, hash: Native.sha256(salt + a1) }));
      cfg = loadCfg(); unlocked = true; user = USER;
      $("#setup").hidden = true; $("#s-rpw").value = $("#s-apw").value = $("#s-apw2").value = ""; err.textContent = "";
      start();
    }).catch(function (er) { err.textContent = er.message; }).then(function () { $("#setup-btn").disabled = false; });
  });
  $("#reset-app").addEventListener("click", function () {
    var b = this;
    if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = t("app_settings_confirm"); setTimeout(function () { b.dataset.armed = ""; b.textContent = t("app_settings_btn"); }, 3500); return; }
    try { localStorage.removeItem("wifi-cfg"); } catch (e) {}
    unlocked = false; R = {}; clearInterval(timer); showFirstScreen();
  });

  // ---- Wi-Fi details card on the first screen ----
  function niEsc(x) { return String(x).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function niRow(k, v) { return v ? '<div class="nr"><span>' + t(k) + '</span><span>' + niEsc(v) + '</span></div>' : ""; }
  function niInfo() { try { return JSON.parse(Native.networkInfo()); } catch (e) { return null; } }
  function niGet(u) { return nativeApi.http("GET", u, {}, "").then(function (r) { return r; }, function () { return null; }); }
  function niDetect(gw) {
    var base = "http://" + gw;
    return niGet(base + "/").then(function (r0) {
      var txt = r0 ? (r0.text || "") + " " + (r0.location || "") : "";
      var loc = r0 && r0.location ? r0.location : "";
      var next = /^https?:\/\//.test(loc) ? loc : (loc ? base + (loc.charAt(0) === "/" ? "" : "/") + loc : base + "/login.html");
      return Promise.all([niGet(next), niGet(base + "/goform/getstok?random=" + Math.random()), niGet(base + "/cgi-bin/skk_get.cgi"), niGet(base + "/cgi-bin/luci/")]).then(function (a) {
        a.forEach(function (r, i) { if (i === 0 && r) txt += " " + (r.text || ""); });
        var x = txt.toLowerCase(), q = a[1], tx = q ? (q.text || "").trim() : "";
        var ac5 = !!q && q.status === 200 && tx && !/^</.test(tx);
        var n2 = a[2] ? (a[2].text || "").trim() : "", nt = !!a[2] && a[2].status === 200 && n2 !== "" && !/^</.test(n2);
        if (/netis/.test(x) || (!ac5 && nt && !/tenda/.test(x))) return { type: "netis", label: "Netis" };
        if (ac5) return { type: "ac5", label: "Tenda AC5" };
        if (/tenda/.test(x)) return { type: "f3", label: "Tenda F3" };
        if (a[3] && /cudy/i.test(String(a[3].text || "").slice(0, 40000))) return { type: "", label: "Cudy" };
        var other = /tp-?link/.test(x) ? "TP-Link" : /huawei/.test(x) ? "Huawei" : /d-link/.test(x) ? "D-Link" : /mercusys/.test(x) ? "Mercusys" : /xiaomi/.test(x) ? "Xiaomi" : "";
        return { type: "", label: other };
      });
    });
  }
  function renderNetCard() {
    var c = $("#netcard"), i = niInfo();
    renderStatus();
    if (!i) { $("#ni-wrap").hidden = true; return; }
    if (!i.wifi) { c.innerHTML = '<div class="nh"><span class="dot off"></span>' + t("ni_off") + '<button id="ni-r">' + t("ni_ref") + '</button></div><div style="opacity:.7">' + t("ni_off_h") + '</div>'; $("#ni-r").onclick = renderNetCard; return; }
    var band = i.freq >= 4900 ? "5G" : (i.freq ? "2.4G" : ""), link = i.linkMbps > 0 ? i.linkMbps + " Mbps" + (band ? " (" + band + ")" : "") : "";
    c.innerHTML = '<div class="nh"><span class="dot"></span>' + t("ni_conn") + '<button id="ni-r">' + t("ni_ref") + '</button></div>' +
      (i.gateway ? '<div class="gwb">' + niEsc(i.gateway) + '</div><div class="nb"><button id="ni-c">' + t("ni_copy") + '</button></div>' : "") +
      niRow("ni_ssid", i.ssid) + niRow("ni_ip", i.ip) + niRow("ni_mask", i.mask) + niRow("ni_dns", i.dns) + niRow("ni_link", link) +
      '<div class="nr"><span>' + t("ni_router") + '</span><span id="ni-m">' + t("ni_look") + '</span></div><div style="opacity:.55;font-size:11px;margin-top:3px">' + t("ni_note") + '</div>';
    $("#ni-r").onclick = function () {
      try {
        if (Native.hasWifiNamePermission && !Native.hasWifiNamePermission()) {
          Native.requestWifiNamePermission();
          return;
        }
      } catch (e) {}
      renderNetCard();
    };
    if (!i.gateway) { $("#ni-m").textContent = t("ni_unk"); return; }
    var useIt = function (type) { var u = $("#s-url"), cur = u.value.trim(); if (!cur || Object.keys(DEF_URL).some(function (k) { return DEF_URL[k] === cur; })) u.value = "http://" + i.gateway; if (type && $("#s-type").value !== "auto") $("#s-type").value = type; };
    $("#ni-c").onclick = function () { try { Native.copyText(i.gateway); this.textContent = t("ni_copied"); } catch (e) {} };
    useIt("");
    niDetect(i.gateway).then(function (d) { $("#ni-m").textContent = d.label || t("ni_unk"); if (d.type) useIt(d.type); }, function () { $("#ni-m").textContent = t("ni_unk"); });
  }

  // ---- "turn on Wi-Fi" bar ----
  function wifiBar() {
    var b = $("#wifi-bar"), i = niInfo();
    if (!i || i.wifi) { b.hidden = true; document.body.style.paddingTop = ""; document.body.classList.remove("wbar"); return; }
    b.textContent = t(i.wifiOn === false ? "wb_off" : "wb_no"); b.hidden = false; document.body.style.paddingTop = "40px"; document.body.classList.add("wbar");
  }
  $("#wifi-bar").addEventListener("click", function () { try { Native.openWifiSettings(); } catch (e) {} });
  setInterval(wifiBar, 2500);
  document.addEventListener("visibilitychange", wifiBar);
  window.addEventListener("focus", wifiBar);
  wifiBar();
  document.addEventListener("click", function (e) {
    var c = $("#netcard"); if (c.hidden || e.target.closest("#ni-btn") || e.target.closest("#netcard")) return;
    c.hidden = true;
  }, true);
  $("#ni-btn").onclick = function () { var c = $("#netcard"); c.hidden = !c.hidden; if (!c.hidden) renderNetCard(); };
  renderNetCard();
  showFirstScreen();
  if (loadCfg() && bioOn()) setTimeout(bioUnlock, 350);
})();
</script>


<script>
(function () {
  var root = document.documentElement;
  var saved = "light";
  try { saved = localStorage.getItem("routermate-theme") === "dark" ? "dark" : "light"; } catch (e) {}
  function applyTheme(mode) {
    mode = mode === "dark" ? "dark" : "light";
    root.setAttribute("data-theme", mode);
    try { localStorage.setItem("routermate-theme", mode); } catch (e) {}
    var b = document.getElementById("theme-toggle");
    if (b) {
      b.innerHTML = mode === "dark"
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg><span>Light</span>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg><span>Dark</span>';
      b.setAttribute("aria-label", mode === "dark" ? "Switch to light theme" : "Switch to dark theme");
      b.title = b.getAttribute("aria-label");
    }
  }
  applyTheme(saved);
  var actions = document.querySelector(".top-actions");
  if (actions && !document.getElementById("theme-toggle")) {
    var b = document.createElement("button");
    b.type = "button"; b.id = "theme-toggle"; b.className = "btn";
    b.addEventListener("click", function () { applyTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark"); });
    actions.insertBefore(b, actions.firstChild);
    applyTheme(saved);
  }
})();
</script>
